<style>
:root{--mask:#FFFFFF;--edge:#D9D4CA;--cu5v:rgba(168,90,42,.15);--cugnd:rgba(107,100,91,.16);
  --copper:#A85A2A;--partfill:#EDEAE3;--ledfill:#F5F3EE;--silk:#6B645B;--ink-svg:#1B1917;
  --ledtext:#6B645B;--slotfill:#D9D4CA;--dimline:#6B645B;--dimtext:#6B645B}
@media (prefers-color-scheme:dark){
 :root{--mask:#1C1A18;--edge:#332F2B;--cu5v:rgba(213,131,75,.20);--cugnd:rgba(154,145,135,.16);
  --copper:#D5834B;--partfill:#211E1B;--ledfill:#131211;--silk:#9A9187;--ink-svg:#E9E4DC;
  --ledtext:#9A9187;--slotfill:#332F2B;--dimline:#9A9187;--dimtext:#9A9187}}

.pcb{width:100%;height:auto;display:block;font-family:"IBM Plex Mono",ui-monospace,monospace}
.pcb .sub{fill:var(--mask);stroke:var(--edge);stroke-width:.35}
.pcb .pour5v{fill:var(--cu5v)}
.pcb .pourgnd{fill:var(--cugnd)}
.pcb .guard{fill:var(--cugnd)}
.pcb .sense{fill:var(--copper)}
.pcb .part{fill:var(--partfill);stroke:var(--edge);stroke-width:.22}
.pcb .led{fill:var(--ledfill);stroke:var(--copper);stroke-width:.3}
.pcb .pin1{fill:var(--copper)}
.pcb .cap{fill:var(--silk)}
.pcb .hole{fill:none;stroke:var(--edge);stroke-width:.35}
.pcb .slot{fill:var(--slotfill)}
.pcb .bite{fill:var(--mask)}
.pcb .padg{fill:var(--cugnd);stroke:var(--copper);stroke-width:.25}
.pcb .pads{fill:var(--cu5v);stroke:var(--copper);stroke-width:.25}
.pcb .thole{fill:var(--copper)}
.pcb .tdrill{fill:var(--mask)}
.pcb .dim,.pcb .dtick{stroke:var(--dimline);stroke-width:.18}
.pcb .lead{stroke:var(--dimline);stroke-width:.18;stroke-dasharray:1.2 1}
.pcb text{fill:var(--silk)}
.pcb .pl{font-size:1.5px;text-anchor:middle;fill:var(--ink-svg)}
.pcb .ln{font-size:1.7px;text-anchor:middle;fill:var(--ledtext)}
.pcb .pn{font-size:1.7px;text-anchor:middle;fill:var(--ink-svg)}
.pcb .dt{font-size:2.1px;text-anchor:middle;fill:var(--dimtext)}
.pcb .zl{font-size:2.2px;text-anchor:middle;fill:var(--dimtext);letter-spacing:.12px}
.pcb .sl{font-size:1.7px;text-anchor:middle;fill:var(--dimtext)}
</style>
