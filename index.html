<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Linked Lights</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0b0b0f;
      --surface: #13131a;
      --border:  #1d1d28;
      --text:    #d0d0e0;
      --muted:   #50506a;
      --accent:  #7c6fff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 4rem;
      gap: 1rem;
    }

    header {
      width: 100%; max-width: 600px;
      display: flex; justify-content: space-between; align-items: center;
    }
    h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    #status { display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; color: var(--muted); }
    #dot { width: 7px; height: 7px; border-radius: 50%; background: #333; transition: background 0.3s; }
    #dot.connected    { background: #4caf50; }
    #dot.connecting   { background: #ff9800; }
    #dot.disconnected { background: #f44336; }

    .card {
      width: 100%; max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
    }
    .card-title {
      font-size: 0.66rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.8rem;
    }

    /* Strip */
    #strip { display: flex; height: 48px; gap: 2px; border-radius: 8px; overflow: hidden; }
    .led { flex: 1; border-radius: 3px; transition: background 0.7s ease, flex 0.5s ease; }
    .led.boundary { box-shadow: inset -2px 0 0 rgba(255,255,255,0.2); }

    /* Divider bar */
    #divider-bar { display: flex; height: 24px; gap: 2px; margin-top: 5px; user-select: none; }
    .div-cell {
      flex: 1; border-radius: 3px; background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; color: transparent;
      transition: background 0.15s; border: 1px solid transparent;
    }
    .div-cell:hover { background: rgba(255,255,255,0.04); border-color: #2a2a3a; }
    .div-cell.split { background: rgba(124,111,255,0.12); border-color: var(--accent); color: var(--accent); }

    /* Buttons */
    .btn-row { display: flex; gap: 0.6rem; margin-bottom: 0.7rem; }
    button {
      flex: 1; padding: 0.72rem 0.5rem;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text);
      font-size: 0.82rem; font-weight: 500; cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
    }
    button:active  { transform: scale(0.96); }
    button:disabled { opacity: 0.28; cursor: default; }
    .btn-accent { background: linear-gradient(135deg,#6c63ff,#48c9b0); border-color: transparent; color: #fff; }
    .btn-on  { background: #0f1f0f; border-color: #3a7a3a; color: #81c784; }
    .btn-off { background: #1f0f0f; border-color: #7a3a3a; color: #e07070; }
    .btn-active { background: #18182a; border-color: var(--accent); color: #a09aff; }

    /* Sliders */
    .sl-row {
      display: flex; align-items: center; gap: 0.7rem;
      margin-bottom: 0.55rem;
    }
    .sl-label { font-size: 0.7rem; color: var(--muted); width: 80px; flex-shrink: 0; }
    .sl-val   { font-size: 0.7rem; color: var(--muted); width: 38px; text-align: right; flex-shrink: 0; }

    input[type=range] {
      flex: 1; -webkit-appearance: none; height: 6px;
      border-radius: 3px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
      cursor: pointer; transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.25); }

    /* Colour slider — gradient set via JS */
    .sl-colour { background: var(--border); }

    /* Group panels */
    #group-panels { display: flex; flex-direction: column; gap: 0.7rem; }
    .group-panel {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.8rem 0.9rem;
    }
    .g-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .g-swatch {
      width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
      transition: background 0.7s ease; border: 1px solid rgba(255,255,255,0.06);
    }
    .g-title { font-size: 0.8rem; color: var(--text); }
    .g-sub   { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

    /* Config */
    #cfg-toggle {
      background: none; border: none; color: var(--muted);
      font-size: 0.72rem; cursor: pointer; letter-spacing: 0.06em;
      text-decoration: underline; text-underline-offset: 3px; padding: 0.2rem;
      align-self: center;
    }
    #cfg-panel { display: none; flex-direction: column; gap: 0.6rem; }
    #cfg-panel.open { display: flex; }
    .cfg-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .cfg-field label { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.06em; }
    .cfg-field input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); font-size: 0.85rem;
      padding: 0.5rem 0.7rem; outline: none; transition: border-color 0.2s;
    }
    .cfg-field input:focus { border-color: var(--accent); }
    .cfg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  </style>
</head>
<body>

<header>
  <h1>Linked Lights</h1>
  <div id="status"><div id="dot" class="disconnected"></div><span id="status-text">disconnected</span></div>
</header>

<!-- Strip preview -->
<div class="card">
  <div class="card-title">Strip — click divider bar to set group boundaries</div>
  <div id="strip"></div>
  <div id="divider-bar"></div>
</div>

<!-- Global controls -->
<div class="card">
  <div class="card-title">Controls</div>
  <div class="btn-row">
    <button class="btn-accent" id="btn-tap"   disabled>Tap</button>
    <button id="btn-power"  disabled>Power</button>
    <button id="btn-reset"  disabled>Reset</button>
  </div>
  <div class="btn-row">
    <button id="btn-drift"  disabled>Auto Drift: On</button>
    <button id="btn-fade"   disabled>Slow Fade: Off</button>
  </div>
  <div class="sl-row">
    <span class="sl-label">Brightness</span>
    <input type="range" id="sl-brightness" min="0" max="100" value="60"
      style="background: linear-gradient(to right, #111, #fff)">
    <span class="sl-val" id="val-brightness">60%</span>
  </div>
  <div class="sl-row">
    <span class="sl-label">Fade Speed</span>
    <input type="range" id="sl-fade" min="20" max="600" value="60"
      style="background: linear-gradient(to right, #7c6fff, #222)">
    <span class="sl-val" id="val-fade">1s</span>
  </div>
  <div class="sl-row" style="margin-bottom:0">
    <span class="sl-label">Drift Every</span>
    <input type="range" id="sl-drift-interval" min="5" max="300" value="45"
      style="background: linear-gradient(to right, #48c9b0, #222)">
    <span class="sl-val" id="val-drift-interval">45s</span>
  </div>
</div>

<!-- Per-group controls -->
<div class="card">
  <div class="card-title">Groups</div>
  <div id="group-panels"></div>
</div>

<!-- Settings -->
<button id="cfg-toggle">⚙ broker settings</button>
<div class="card" id="cfg-panel">
  <div class="card-title">Broker Settings</div>
  <div class="cfg-field">
    <label>BROKER (WebSocket URL)</label>
    <input id="cfg-broker" value="wss://broker.hivemq.com:8884/mqtt">
  </div>
  <div class="cfg-field">
    <label>TOPIC PREFIX</label>
    <input id="cfg-prefix" value="picolight_lf26">
  </div>
  <div class="cfg-row">
    <div class="cfg-field"><label>NUM LEDS</label><input id="cfg-leds"   type="number" min="1" max="144" value="10"></div>
    <div class="cfg-field"><label>NUM GROUPS</label><input id="cfg-groups" type="number" min="1" max="10"  value="3"></div>
  </div>
  <button id="btn-reconnect">Reconnect</button>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
let cfg = {
  broker:    localStorage.getItem("ll_broker")    || "wss://broker.hivemq.com:8884/mqtt",
  prefix:    localStorage.getItem("ll_prefix")    || "picolight_lf26",
  numLeds:   parseInt(localStorage.getItem("ll_leds")   || "10"),
  numGroups: parseInt(localStorage.getItem("ll_groups") || "3"),
};
document.getElementById("cfg-broker").value  = cfg.broker;
document.getElementById("cfg-prefix").value  = cfg.prefix;
document.getElementById("cfg-leds").value    = cfg.numLeds;
document.getElementById("cfg-groups").value  = cfg.numGroups;

// ── Palette ───────────────────────────────────────────────────
const PALETTE = [
  [255,200,80],[255,160,0],[255,120,0],[255,60,0],
  [255,0,0],[255,0,60],[255,0,140],[200,0,200],
  [140,0,255],[80,0,255],[0,0,255],[0,60,255],
  [0,140,255],[0,200,255],[0,255,220],[0,255,160],
  [0,255,80],[0,220,0],[80,255,0],[160,255,0],
  [220,255,0],[255,240,0],[255,180,40],[255,100,80],
  [255,80,160],[180,40,255],[40,100,255],[0,180,180],
  [20,255,120],[255,220,120],
];
const BASE_W = [0,0,0,200];

function lerp(a,b,t) { return a+(b-a)*t; }

function paletteRGB(pos) {
  const n = PALETTE.length;
  const scaled = Math.min(pos, 0.9999) * (n-1);
  const idx  = Math.floor(scaled);
  const frac = scaled - idx;
  const c1 = PALETTE[idx], c2 = PALETTE[Math.min(idx+1,n-1)];
  const tint = [0,1,2].map(i => lerp(c1[i],c2[i],frac));
  const sat = pos;
  const r = Math.round(lerp(BASE_W[0],tint[0],sat));
  const g = Math.round(lerp(BASE_W[1],tint[1],sat));
  const b = Math.round(lerp(BASE_W[2],tint[2],sat));
  const w = Math.round(BASE_W[3]*(1-sat));
  return [Math.min(255,r+w), Math.min(255,g+Math.round(w*0.8)), Math.min(255,b+Math.round(w*0.6))];
}

function rgbStr(pos) {
  const [r,g,b] = paletteRGB(pos);
  return `rgb(${r},${g},${b})`;
}

// Build gradient CSS for a colour slider
function paletteGradient() {
  const stops = [];
  const steps = 24;
  for (let i = 0; i <= steps; i++) {
    const pos = i / steps;
    const [r,g,b] = paletteRGB(pos);
    stops.push(`rgb(${r},${g},${b}) ${Math.round(pos*100)}%`);
  }
  return `linear-gradient(to right, ${stops.join(", ")})`;
}
const COLOUR_GRADIENT = paletteGradient();

// ── State ─────────────────────────────────────────────────────
let boundaries     = new Set();
let groupPositions = [];
let groupWLevels   = [];
let powered        = true;
let brightness     = 0.6;
let fadeSteps      = 60;
let driftEnabled   = true;
let driftInterval  = 45;
let slowFadeOn     = false;
const BOARD_ID     = "web_app";
const SLOW_STEPS   = 400;
const FAST_STEPS   = 60;

function initGroups(n) {
  boundaries.clear();
  const size = Math.floor(cfg.numLeds / n);
  for (let i = 1; i < n; i++) boundaries.add(i * size);
  groupPositions = Array.from({length: n}, () => 0.0);
  groupWLevels   = Array.from({length: n}, () => 1.0);
}

function getGroups() {
  const splits = [0, ...Array.from(boundaries).sort((a,b)=>a-b), cfg.numLeds];
  return splits.slice(0,-1).map((start,i) => ({
    pos:  groupPositions[i] ?? 0,
    w:    groupWLevels[i]   ?? 1.0,
    size: splits[i+1] - start,
  }));
}

function groupCount() { return boundaries.size + 1; }

// ── MQTT ──────────────────────────────────────────────────────
let client = null;

function topic() { return cfg.prefix + "/events"; }

function setStatus(cls, text) {
  document.getElementById("dot").className = cls;
  document.getElementById("status-text").textContent = text;
  const ok = cls === "connected";
  ["btn-tap","btn-power","btn-reset","btn-drift","btn-fade"].forEach(id => {
    document.getElementById(id).disabled = !ok;
  });
}

function connect() {
  if (client) { try { client.end(true); } catch(e) {} }
  setStatus("connecting", "connecting…");
  client = mqtt.connect(cfg.broker, { clientId: "webui_"+Math.random().toString(16).slice(2), clean: true });
  client.on("connect", () => {
    setStatus("connected", cfg.broker.replace(/^wss?:\/\//,"").replace(/\/mqtt$/,""));
    client.subscribe(topic());
  });
  client.on("message", (t, msg) => {
    try {
      const d = JSON.parse(msg.toString());
      if (d.from === BOARD_ID) return;
      if (d.on         !== undefined) { powered = d.on;              updatePowerBtn(); }
      if (d.brightness !== undefined) { brightness = d.brightness;   syncBrightnessSlider(); }
      if (d.fade_steps !== undefined) { fadeSteps = d.fade_steps;    syncFadeSlider(); }
      if (d.drift_enabled  !== undefined) { driftEnabled = d.drift_enabled;   updateDriftBtn(); }
      if (d.drift_interval !== undefined) { driftInterval = d.drift_interval; syncDriftIntervalSlider(); }
      if (d.groups) {
        groupPositions = d.groups.map(x => x.pos);
        groupWLevels   = d.groups.map(x => x.w);
        boundaries.clear();
        let cursor = 0;
        d.groups.slice(0,-1).forEach(g => { cursor += g.size; boundaries.add(cursor); });
        renderAll();
      }
    } catch(e) {}
  });
  client.on("error",     () => setStatus("disconnected", "error"));
  client.on("close",     () => setStatus("disconnected", "disconnected"));
  client.on("reconnect", () => setStatus("connecting",   "reconnecting…"));
}

function publish(payload) {
  if (!client || !client.connected) return;
  payload.from = BOARD_ID;
  client.publish(topic(), JSON.stringify(payload));
}

function publishState() {
  publish({ groups: getGroups(), on: powered, brightness, fade_steps: fadeSteps, drift_enabled: driftEnabled, drift_interval: driftInterval });
}

function syncDriftIntervalSlider() {
  document.getElementById("sl-drift-interval").value = driftInterval;
  document.getElementById("val-drift-interval").textContent = driftInterval + "s";
}

// ── Random ────────────────────────────────────────────────────
function randFloat(lo,hi) { return lo + Math.random()*(hi-lo); }

function randomPartition(total, n, mn, mx) {
  const sizes = []; let rem = total;
  for (let i = 0; i < n; i++) {
    const left = n-i;
    const lo = Math.max(mn, rem-left*mx);
    const hi = Math.min(mx, rem-(left-1)*mn);
    let s = Math.round(randFloat(lo, hi));
    s = Math.max(mn, Math.min(mx, s));
    sizes.push(s); rem -= s;
  }
  sizes[sizes.length-1] += rem;
  return sizes;
}

function randomise() {
  const n = groupCount();
  const sizes = randomPartition(cfg.numLeds, n, 1, 8);
  boundaries.clear();
  let cursor = 0;
  sizes.slice(0,-1).forEach(s => { cursor += s; boundaries.add(cursor); });
  groupPositions = Array.from({length: n}, () => randFloat(0,1));
  groupWLevels   = Array.from({length: n}, () => randFloat(0.6,1.0));
}

// ── Rendering ─────────────────────────────────────────────────
function renderStrip() {
  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  const groups = getGroups();
  let ledIdx = 0;
  groups.forEach(g => {
    for (let j = 0; j < g.size; j++) {
      const el = document.createElement("div");
      el.className = "led";
      el.style.background = powered ? rgbStr(g.pos) : "#111";
      if (j === g.size-1 && ledIdx < cfg.numLeds-1) el.classList.add("boundary");
      strip.appendChild(el);
      ledIdx++;
    }
  });
}

function renderDividerBar() {
  const bar = document.getElementById("divider-bar");
  bar.innerHTML = "";
  for (let i = 0; i < cfg.numLeds; i++) {
    const el = document.createElement("div");
    el.className = "div-cell" + (boundaries.has(i) ? " split" : "");
    el.textContent = boundaries.has(i) ? "┃" : "";
    if (i > 0) {
      el.addEventListener("click", () => {
        if (boundaries.has(i)) boundaries.delete(i);
        else boundaries.add(i);
        rebuildGroupData();
        renderAll();
        publishState();
      });
    }
    bar.appendChild(el);
  }
}

function rebuildGroupData() {
  const n = groupCount();
  while (groupPositions.length < n) groupPositions.push(randFloat(0,1));
  while (groupWLevels.length   < n) groupWLevels.push(randFloat(0.6,1.0));
  groupPositions = groupPositions.slice(0, n);
  groupWLevels   = groupWLevels.slice(0, n);
}

function renderGroupPanels() {
  const container = document.getElementById("group-panels");
  container.innerHTML = "";
  const groups = getGroups();
  groups.forEach((g, i) => {
    const panel = document.createElement("div");
    panel.className = "group-panel";
    panel.innerHTML = `
      <div class="g-header">
        <div class="g-swatch" id="gsw-${i}" style="background:${rgbStr(g.pos)}"></div>
        <div>
          <div class="g-title">Group ${i+1}</div>
          <div class="g-sub" id="gsub-${i}">${g.size} LED${g.size!==1?"s":""}</div>
        </div>
      </div>
      <div class="sl-row">
        <span class="sl-label">Colour</span>
        <input type="range" class="sl-colour" min="0" max="1000" value="${Math.round(g.pos*1000)}"
          style="background:${COLOUR_GRADIENT}"
          oninput="onGroupHue(${i},this.value/1000)">
        <span class="sl-val" id="ghue-${i}">${Math.round(g.pos*100)}%</span>
      </div>
      <div class="sl-row" style="margin-bottom:0">
        <span class="sl-label">Warm White</span>
        <input type="range" min="0" max="1000" value="${Math.round(g.w*1000)}"
          style="background:linear-gradient(to right,#222,#ffe4a0)"
          oninput="onGroupW(${i},this.value/1000)">
        <span class="sl-val" id="gww-${i}">${Math.round(g.w*100)}%</span>
      </div>`;
    container.appendChild(panel);
  });
}

function renderAll() {
  rebuildGroupData();
  renderStrip();
  renderDividerBar();
  renderGroupPanels();
}

function syncBrightnessSlider() {
  const v = Math.round(brightness*100);
  document.getElementById("sl-brightness").value = v;
  document.getElementById("val-brightness").textContent = v+"%";
}

function syncFadeSlider() {
  document.getElementById("sl-fade").value = fadeSteps;
  document.getElementById("val-fade").textContent = Math.round(fadeSteps*16/1000*10)/10+"s";
}

// ── Group handlers ────────────────────────────────────────────
function onGroupHue(i, val) {
  groupPositions[i] = val;
  document.getElementById(`gsw-${i}`).style.background = rgbStr(val);
  document.getElementById(`ghue-${i}`).textContent = Math.round(val*100)+"%";
  renderStrip();
  publishState();
}

function onGroupW(i, val) {
  groupWLevels[i] = val;
  document.getElementById(`gww-${i}`).textContent = Math.round(val*100)+"%";
  publishState();
}

// ── Global handlers ───────────────────────────────────────────
function updatePowerBtn() {
  const btn = document.getElementById("btn-power");
  btn.textContent = powered ? "Turn Off" : "Turn On";
  btn.className   = powered ? "btn-on" : "btn-off";
  renderStrip();
}

function updateDriftBtn() {
  const btn = document.getElementById("btn-drift");
  btn.textContent = driftEnabled ? "Auto Drift: On" : "Auto Drift: Off";
  btn.className   = driftEnabled ? "btn-active" : "";
}

function updateFadeBtn() {
  const btn = document.getElementById("btn-fade");
  btn.textContent = slowFadeOn ? "Slow Fade: On" : "Slow Fade: Off";
  btn.className   = slowFadeOn ? "btn-active" : "";
  fadeSteps = slowFadeOn ? SLOW_STEPS : FAST_STEPS;
  syncFadeSlider();
}

document.getElementById("btn-tap").addEventListener("click", () => {
  randomise(); renderAll(); publishState();
});

document.getElementById("btn-power").addEventListener("click", () => {
  powered = !powered; updatePowerBtn(); publishState();
});

document.getElementById("btn-reset").addEventListener("click", () => {
  groupPositions = groupPositions.map(() => 0.0);
  groupWLevels   = groupWLevels.map(() => 1.0);
  brightness = 0.6; fadeSteps = FAST_STEPS; slowFadeOn = false; driftInterval = 45;
  syncBrightnessSlider(); syncFadeSlider(); updateFadeBtn(); syncDriftIntervalSlider();
  renderAll(); publishState();
});

document.getElementById("btn-drift").addEventListener("click", () => {
  driftEnabled = !driftEnabled; updateDriftBtn(); publishState();
});

document.getElementById("btn-fade").addEventListener("click", () => {
  slowFadeOn = !slowFadeOn; updateFadeBtn(); publishState();
});

document.getElementById("sl-brightness").addEventListener("input", function() {
  brightness = this.value/100;
  document.getElementById("val-brightness").textContent = this.value+"%";
  publishState();
});

document.getElementById("sl-fade").addEventListener("input", function() {
  fadeSteps = parseInt(this.value);
  document.getElementById("val-fade").textContent = Math.round(fadeSteps*16/1000*10)/10+"s";
  publishState();
});

document.getElementById("sl-drift-interval").addEventListener("input", function() {
  driftInterval = parseInt(this.value);
  document.getElementById("val-drift-interval").textContent = driftInterval + "s";
  publishState();
});

document.getElementById("cfg-toggle").addEventListener("click", () => {
  document.getElementById("cfg-panel").classList.toggle("open");
});

document.getElementById("btn-reconnect").addEventListener("click", () => {
  cfg.broker    = document.getElementById("cfg-broker").value.trim();
  cfg.prefix    = document.getElementById("cfg-prefix").value.trim();
  cfg.numLeds   = parseInt(document.getElementById("cfg-leds").value);
  cfg.numGroups = parseInt(document.getElementById("cfg-groups").value);
  localStorage.setItem("ll_broker", cfg.broker);
  localStorage.setItem("ll_prefix", cfg.prefix);
  localStorage.setItem("ll_leds",   cfg.numLeds);
  localStorage.setItem("ll_groups", cfg.numGroups);
  initGroups(cfg.numGroups);
  renderAll(); connect();
});
